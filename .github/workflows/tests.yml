name: Unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Test protocol script with local mock (no API key)
        run: python3 -m unittest discover -s test -p 'test_protocol_script.py' -v
